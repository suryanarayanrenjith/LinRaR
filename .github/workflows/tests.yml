name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow and refuses to publish unless it passes:
  # the suite is the gate a release goes through, not a separate opinion.
  workflow_call:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the tools LinRAR drives
        run: |
          sudo apt-get update
          # Qt needs these to start at all, even offscreen.
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libgl1 \
                                  libegl1 libxkbcommon-x11-0
          sudo apt-get install -y unrar p7zip-full zip squashfs-tools \
                                  libsecret-tools
          # rar is shareware and lives in multiverse, so it is installed on its
          # own: a failure here must not take the packages above with it, and
          # run_all.py skips the files that need it rather than failing them.
          sudo add-apt-repository -y multiverse || true
          sudo apt-get update || true
          sudo apt-get install -y rar || echo "rar unavailable; those files will be skipped"

      - name: Install PyQt6
        run: pip install -r requirements.txt

      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/run_all.py

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libgl1 libegl1 \
                                  libxkbcommon-x11-0

      - name: Install, verify, uninstall
        run: |
          ./install.sh --user --no-deps -y
          test -x "$HOME/.local/bin/linrar"
          test -f "$HOME/.local/share/applications/linrar.desktop"
          test -f "$HOME/.local/share/icons/hicolor/48x48/apps/linrar.png"
          QT_QPA_PLATFORM=offscreen "$HOME/.local/bin/linrar" --version
          QT_QPA_PLATFORM=offscreen "$HOME/.local/bin/linrar" -V
          QT_QPA_PLATFORM=offscreen "$HOME/.local/bin/linrar" -h
          QT_QPA_PLATFORM=offscreen "$HOME/.local/bin/linrar" --self-test
          ./uninstall.sh -y
          test ! -e "$HOME/.local/bin/linrar"
          test ! -e "$HOME/.local/share/applications/linrar.desktop"
          test ! -d .venv
