      <!-- gloss -->
      <path d="M5.9 34.1 h29.2 v3.0959999999999996 h-29.2 z"
            fill="#ffffff" opacity="0.22"/>
    </g>
    
    <linearGradient id="bk1" x1="0" y1="0" x2="0" y2="1">
