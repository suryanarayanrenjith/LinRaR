</filter>

  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF4"/><stop offset="1" stop-color="#DCCFAE"/></linearGradient>
  <linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E6E7C"/><stop offset="0.5" stop-color="#2A2A34"/><stop offset="1" stop-color="#1A1A22"/></linearGradient>
  <linearGradient id="stt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#82828E"/><stop offset="1" stop-color="#6E6E7C"/></linearGradient>
  <linearGradient id="fdf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE09B"/><stop offset="0.55" stop-color="#F2C14E"/><stop offset="1" stop-color="#C68F22"/></linearGradient>
  <linearGradient id="fdb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE09B"/><stop offset="1" stop-color="#C68F22"/></linearGradient>
