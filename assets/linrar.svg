            fill="#ffffff" opacity="0.22"/>
    </g>
    
      <!-- binding strap across the whole stack -->
      <path d="M25.5 14.8 l4.6 -4.6 h5 l-4.6 4.6 z" fill="url(#stt)"/>
      <rect x="25.5" y="14.8" width="5" height="27" fill="url(#st)"/>
      <rect x="26.4" y="14.8" width="1.2" height="27" fill="#8A8A98"
