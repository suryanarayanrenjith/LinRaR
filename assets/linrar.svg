            fill="#ffffff" opacity="0.22"/>
    </g>
    
    <linearGradient id="bk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC0EE"/>
      <stop offset="0.45" stop-color="#3F86CE"/>
      <stop offset="1" stop-color="#1E5FA4"/>
    </linearGradient>
    <linearGradient id="bk2t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FC0EE"/>
      <stop offset="1" stop-color="#3F86CE"/>
    </linearGradient>
    <g>
