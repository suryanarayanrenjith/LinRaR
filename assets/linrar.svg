      <!-- top cover -->
      <path d="M5.0 33.2 l4.6 -4.6 h31.0 l-4.6 4.6 z" fill="url(#bk0t)"/>
      <!-- front cover -->
      <rect x="5.0" y="33.2" width="31.0" height="8.6" rx="1.2"
