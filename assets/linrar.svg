  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F09A8E"/><stop offset="0.5" stop-color="#D6412F"/><stop offset="1" stop-color="#93231A"/></linearGradient>
  <linearGradient id="blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CCBF2"/><stop offset="0.5" stop-color="#2C7FC4"/><stop offset="1" stop-color="#14548C"/></linearGradient>
  <linearGradient id="amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDF95"/><stop offset="0.5" stop-color="#EDA92C"/><stop offset="1" stop-color="#B0740E"/></linearGradient>
  <linearGradient id="stl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2E8EF"/><stop offset="0.5" stop-color="#98A5B4"/><stop offset="1" stop-color="#5C6774"/></linearGradient>
  <linearGradient id="gls" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
